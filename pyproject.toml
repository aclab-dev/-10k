[project]
name = "crypto-futures-gpt55-bot"
version = "0.1.0"
description = "Bot automatico de futuros crypto con GPT-5.5 + Quant + Risk - PAPER-first, LIVE bloqueado"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*", "worker*"]
